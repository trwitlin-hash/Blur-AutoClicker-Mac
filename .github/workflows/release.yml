name: Release

on:
  push:
    tags:
      - "v*-macos.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build macOS (Apple Silicon)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: "./src-tauri -> target"

      - run: npm ci

      # APPLE_SIGNING_IDENTITY is required. Without it Tauri emits a
      # linker-signed bundle with no sealed resources and silently drops
      # entitlements.plist, which stops the Accessibility grant from sticking.
      - name: Build
        env:
          APPLE_SIGNING_IDENTITY: "-"
        run: npm run tauri -- build --target aarch64-apple-darwin

      - name: Verify the bundle is sealed
        run: |
          APP=src-tauri/target/aarch64-apple-darwin/release/bundle/macos/BlurAutoClicker.app
          codesign --verify --deep --strict "$APP"
          codesign -dv --verbose=2 "$APP" 2>&1 | grep -q 'Sealed Resources' \
            || { echo "bundle is not sealed"; exit 1; }

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME} — Apple Silicon" \
            --generate-notes \
            src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg

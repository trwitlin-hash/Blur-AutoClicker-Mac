name: Release

on:
  push:
    tags:
      - "v*-macos.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build macOS (Apple Silicon)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: "./src-tauri -> target"

      - run: npm ci

      # Build the .app only. Signing is done afterwards, because Tauri's
      # bundler enables hardened runtime when it signs, and a hardened-runtime
      # binary with only an ad-hoc signature is not trusted for the
      # Accessibility grant that CGEventPost needs.
      - name: Build app bundle
        run: npm run tauri -- build --target aarch64-apple-darwin --bundles app

      # Ad-hoc, sealed, no hardened runtime. Without this step Tauri leaves a
      # linker-signed bundle with no _CodeSignature at all, which also breaks
      # the grant.
      - name: Sign
        run: |
          APP=src-tauri/target/aarch64-apple-darwin/release/bundle/macos/BlurAutoClicker.app
          codesign --force --deep --sign - \
            --entitlements src-tauri/entitlements.plist "$APP"
          codesign --verify --deep --strict "$APP"
          codesign -d --verbose=2 "$APP" 2>&1 | grep -q 'Sealed Resources' \
            || { echo "bundle is not sealed"; exit 1; }
          codesign -d --verbose=2 "$APP" 2>&1 | grep -q 'flags=0x2(adhoc)' \
            || { echo "unexpected signature flags (hardened runtime?)"; exit 1; }

      # Assemble the disk image from the signed bundle.
      - name: Package dmg
        run: |
          APP=src-tauri/target/aarch64-apple-darwin/release/bundle/macos/BlurAutoClicker.app
          VERSION=$(node -p "require('./package.json').version")
          STAGE=$(mktemp -d)
          cp -R "$APP" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          mkdir -p dist-dmg
          hdiutil create -volname BlurAutoClicker -srcfolder "$STAGE" -ov \
            -format UDZO "dist-dmg/BlurAutoClicker_${VERSION}_aarch64.dmg"

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME} — Apple Silicon" \
            --generate-notes \
            dist-dmg/*.dmg
